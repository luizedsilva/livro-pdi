project:
  type: book

lang: pt-BR

licence: "CC BY-SA 4.0"

number-depth: 2

filters:
  - simulacao.lua

book:
  title: "Processamento Digital de Imagens"
  subtitle: "Uma abordagem interativa com P5.js"
  author:
    - name: "Luiz Eduardo da Silva"
      affiliation: "Universidade Federal de Alfenas"
    - name: "Tiago Silveira"
      affiliation: "Universidade Federal de Alfenas"
  cover-image: capa.png
  date: today
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - chapters/amostragem.qmd
    - chapters/melhoramento.qmd
    - chapters/fourier.qmd
    - chapters/cor.qmd
    - chapters/compressao.qmd
    - chapters/morfologia.qmd
    - chapters/segmentacao.qmd
    - chapters/representacao.qmd
    - chapters/interpretacao.qmd
    - chapters/creditos.qmd
    - chapters/references.qmd

bibliography: references.bib

format:
  html:
    css: styles.css
    page-layout: article
    navigation:
      position: bottom
    date-format: "DD/MM/YYYY"
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: book
    pdf-engine: lualatex
    include-in-header: header.tex
    geometry:
      - paperwidth=17cm
      - paperheight=24cm
      - margin=2cm
  epub:
    toc: true
    number-sections: true
    css: styles.css
    cover-image: capa.png
